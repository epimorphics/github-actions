name: "Start Hosted Runner"
description: "Starting a hosted runner"
inputs:
  aws-access-key-id:
    description: 'AWS ACCESS KEY ID'
    required: true
  aws-secret-access-key:
    description: 'AWS SECRET ACCESS KEY'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
    default: 'eu-west-1'
  aws-asg:
    description: 'Runner ASG'
    required: true
  runner:
    description: 'Github runner name'
    required: true
  spot-file:
    description: 'Spot Fleet Request JSON file'
    default: 's3://epi-ops/github/spot.json'
  wait:
    default: 30
    required: false
runs:
  using: "composite"
  steps: 
    - name: "Run Spot Fleet Request"
      id: SpotFleetRequest
      env:
        AWS_ACCESS_KEY_ID:     "${{ inputs.aws-access-key-id }}"
        AWS_SECRET_ACCESS_KEY: "${{ inputs.aws-secret-access-key }}"
        AWS_DEFAULT_REGION:    "${{ inputs.aws-region }}"
      shell: bash
      run: |
        RUNNERS=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=${{ inputs.runner }}' 'Name=instance-state-name,Values=running' | jq -r '.Reservations | length')
        while [ $RUNNERS -gt 0 ]; do
          echo "Waiting for runners to terminate. Current number of runners: $RUNNERS."
          sleep 30
          RUNNERS=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=${{ inputs.runner }}' 'Name=instance-state-name,Values=running' | jq -r '.Reservations | length')
        done
        if [ "$RUNNERS" == "0" ]; then
          echo "No runners are running, proceeding to scale ASG ${{ inputs.aws-asg }}..."
          aws autoscaling set-desired-capacity --auto-scaling-group-name ${{ inputs.aws-asg }} --desired-capacity 1
        else
          echo "Unable to ensure no runners are running, aborting ASG scaling. [$RUNNERS]"
          exit 1
        fi
    - name: "Pause for ASG to scale up"
      id: WaitForHostedRunner
      shell: bash
      run: |
        sleep ${{ inputs.wait }}
