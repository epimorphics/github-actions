name: "Start Hosted Runner"
description: "Starting a hosted runner"
inputs:
  aws-access-key-id:
    description: 'AWS ACCESS KEY ID'
    required: true
  aws-secret-access-key:
    description: 'AWS SECRET ACCESS KEY'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
    default: 'eu-west-1'
  aws-asg:
    description: 'Runner ASG'
    required: true
# spot-req-id:
#   description: 'Spot Fleet Request ID'
#   required: true
runs:
  using: "composite"
  steps: 
#   - name: "Cancel Spot Fleet Request"
#     id: CancelSpotFleetRequest
    - name: "Scale down ASG"
      id: ScaleDownASG
      env:
        AWS_ACCESS_KEY_ID:     "${{ inputs.aws-access-key-id }}"
        AWS_SECRET_ACCESS_KEY: "${{ inputs.aws-secret-access-key }}"
        AWS_REGION:            "${{ inputs.aws-region }}"
      shell: bash
      run: |
#       if [ -n "${{ inputs.spot-req-id }}" ]
        if [ -n "${{ inputs.aws-asg }}" ]
        then
#         aws ec2 cancel-spot-fleet-requests --spot-fleet-request-ids ${{ inputs.spot-req-id }} --terminate-instances
          aws autoscaling set-desired-capacity --auto-scaling-group-name ${{ aws-asg }} --desired-capacity 0
        else
#         echo "No Spot Fleet Request to cancel"
          echo "No ASG given"
        fi
