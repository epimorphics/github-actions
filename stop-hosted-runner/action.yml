name: "Stop Hosted Runner"
description: "Stopping a hosted runner"
inputs:
  aws-access-key-id:
    description: 'AWS ACCESS KEY ID'
    required: true
  aws-secret-access-key:
    description: 'AWS SECRET ACCESS KEY'
    required: true
  aws-region:
    description: 'AWS region'
    required: true
    default: 'eu-west-1'
  aws-asg:
    description: 'Runner ASG'
    required: true
runs:
  using: "composite"
  steps:
    - name: "Scale down ASG"
      id: ScaleDownASG
      env:
        AWS_ACCESS_KEY_ID:     "${{ inputs.aws-access-key-id }}"
        AWS_SECRET_ACCESS_KEY: "${{ inputs.aws-secret-access-key }}"
        AWS_REGION:            "${{ inputs.aws-region }}"
      shell: bash
      run: |
        if [ -n "${{ inputs.aws-asg }}" ]
        then
          aws autoscaling set-desired-capacity --auto-scaling-group-name ${{ aws-asg }} --desired-capacity 0
        else
          echo "No ASG given"
        fi
