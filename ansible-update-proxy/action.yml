name: 'Proxy Update'
description: "Limited Deployment via Ansible"
inputs:
  aws-profile:
    description: 'AWS Profile'
    required: false
    default: 'aws'
  generate-hosts:
    description: 'Generate hosts file for the stage'
    required: false
    default: 'false'
  path:
    description: 'Ansible Repoistory Path'
    required: false
    default: 'ansible'
  playbook:
    description: 'Ansible Playbook'
    required: false
    default: 'apps.yml'
  stage:
    description: 'Envivonment/Stage to deploy'
    required: true
  secret:
    description: 'Ansible Vault Secret'
    required: true
  vault-secret-file:
    description: 'Ansible Vault Secret file'
    required: false
    default: .secret/default
runs:
  using: "composite"
  steps: 
    - name: "Run Ansible"
      shell: bash
      run: | 
        type -all ansible
        /bin/ansible --version
        cd ${{ inputs.path }}
        mkdir -p $(dirname ${{ inputs.vault-secret-file }})
        echo ${{ inputs.secret }} > ${{ inputs.vault-secret-file }}
        chmod 600 ${{ inputs.vault-secret-file }}
        [ -f requirements.yml ] && /bin/ansible-galaxy collection install -r requirements.yml
        if [ "${{ inputs.generate-hosts }}" == "true" ]
        then
          echo "Generating hosts configuration ..."
          INVERTORY=$(/bin/ansible-inventory --list ${{ inputs.stage }})
          if [ -n "$INVERTORY" ]
          then
            for host in $(echo $INVERTORY| jq -r .aws_ec2.hosts.[] | sort -u)
            do
              ip=$(/bin/ansible-inventory --host $host  | jq -r .private_ip_address);
              [ -n "$ip" ] && printf "\nHost $host\n  Hostname $ip\n" >> ~/.ssh/config
            done
          else
            echo "No hosts found for ${{ inputs.stage }}"
            echo "Inventory: $INVERTORY"
            exit 1
          fi
        fi
        CMD='/bin/ansible-inventory --graph'
        echo "=============================================================================="
        echo $CMD
        echo "=============================================================================="
        AWS_PROFILE=${{ inputs.aws-profile }} $CMD
